<!DOCTYPE html>
<html>
<head>
<style>
  .parent {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 300px;
    height: 100px; /* landscape */
    background: #ccc;
    margin-bottom: 20px;
  }
  .parent2 {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100px;
    height: 300px; /* portrait */
    background: #ccc;
  }
</style>
</head>
<body>
  <!-- Test 1: Just aspect-ratio -->
  <div class="parent">
    <div style="background: red; aspect-ratio: 1/1; max-width: 100%; max-height: 100%; height: 100%;" class="child"></div>
  </div>
  <!-- Test 2: aspect-ratio on img -->
  <div class="parent2">
    <div style="background: blue; aspect-ratio: 1/1; max-width: 100%; max-height: 100%; width: 100%;" class="child"></div>
  </div>
</body>
</html>
