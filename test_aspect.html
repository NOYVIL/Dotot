<!DOCTYPE html>
<html>
<head>
<style>
  .parent {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 300px;
    height: 100px; /* landscape */
    background: #ccc;
    margin-bottom: 20px;
  }
  .parent2 {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100px;
    height: 300px; /* portrait */
    background: #ccc;
  }
  .child {
    background: red;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    max-height: 100%;
    /* Let's try some tricks */
    height: 100%;
  }
  .child2 {
    background: blue;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    max-height: 100%;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="parent"><div class="child"></div></div>
  <div class="parent2"><div class="child"></div></div>
  <div class="parent"><div class="child2"></div></div>
  <div class="parent2"><div class="child2"></div></div>
</body>
</html>
